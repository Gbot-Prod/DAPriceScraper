[build-system]
requires = ["setuptools>=84.2"]
build-backend = "setuptools.build_meta"

[project]
name = "DAPriceScraper"
version = "1.0.0"
description = "Philippine DA Daily Price Index scraper, parser, and database ingestion pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Gbot-Prod" }]

dependencies = [
    "httpx>=0.29",
    "beautifulsoup4>=4.15",
    "tenacity>=9.2",
    "pdfplumber>=0.11.11",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.1",
    "typer>=0.29",
    "rich>=15.0",
    "fastapi>=0.165",
    "uvicorn>=0.54",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3"]
dev = [
    "pytest>=9.2",
    "respx>=0.23",
    "ruff>=0.17",
]

[project.scripts]
da-dpi = "da_price_index.cli:app"

[tool.setuptools.package-data]
da_price_index = ["site/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer declare parameters through call defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "typer.Option",
    "typer.Argument",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
