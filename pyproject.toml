[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "DAPriceScraper"
version = "0.1.0"
description = "Philippine DA Daily Price Index scraper, parser, and database ingestion pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Gbot-Prod" }]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "tenacity>=8.2",
    "pdfplumber>=0.11",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
da-dpi = "da_price_index.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and Typer declare parameters through call defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "typer.Option",
    "typer.Argument",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
